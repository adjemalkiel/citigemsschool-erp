<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ logo }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ abbr }}</title>
    <!-- Education SPA (vendored under citigems_custom — /assets/education/frontend is absent on this bench) -->
    <script type="module" crossorigin src="/assets/citigems_custom/education_frontend/assets/index.4bcff034.js"></script>
    <link rel="modulepreload" href="/assets/citigems_custom/education_frontend/assets/frappe-ui.5214fb40.js" />
    <link rel="stylesheet" href="/assets/citigems_custom/education_frontend/assets/frappe-ui.005832b0.css" />
    <link rel="stylesheet" href="/assets/citigems_custom/education_frontend/assets/index.92fa9b3a.css" />
    <!-- Citigems chrome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/citigems_custom/css/citigems_brand.css?v=20261112j" />
  </head>
  <body class="citigems-edu-spa">
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>
      window.csrf_token = "{{ csrf_token }}";
      window.document.title = "{{ abbr }}";
      (function () {
        var m = document.cookie.match(/(?:^|;\s*)preferred_language=([^;]*)/);
        var c = m ? decodeURIComponent(m[1]).toLowerCase() : "";
        window.citigemsLang = c === "en" ? "en" : "fr";
        document.documentElement.setAttribute("lang", window.citigemsLang);
        var link = document.querySelector("link[rel~='icon']");
        if (!link) {
          link = document.createElement("link");
          link.rel = "icon";
          document.getElementsByTagName("head")[0].appendChild(link);
        }
        link.href = "{{ logo }}";
      })();
    </script>
    <script src="/assets/citigems_custom/js/edu_portal_chrome.js?v=20261112j"></script>
  </body>
</html>
