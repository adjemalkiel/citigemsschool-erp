[project]
name = "citigems_custom"
authors = [
    { name = "Malkiel Adje", email = "adjemalkiel@gmail.com"}
]
description = "Citigems School ERP customizations — e-MECeF, FedaPay, French branding"
requires-python = ">=3.10,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[deploy.dependencies.apt]
packages = []

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF"]
ignore = [
    "B017", "B018", "B023", "B904", "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722", "W191", "UP030", "UP031", "UP032", "UP037", "UP040",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
